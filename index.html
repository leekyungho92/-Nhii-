<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Galaxy 杜兒</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #020208;
            font-family: 'Quicksand', sans-serif;
            overflow: hidden;
            color: #fff;
        }

        /* Background Nebula Effect */
        .bg-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(236,72,153,0.3) 0%, rgba(139,92,246,0.15) 50%, rgba(0,0,0,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            filter: blur(50px);
            animation: pulse 4s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.5; }
            100% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
        }

        .card {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 40px 30px;
            width: 90%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 0 15px rgba(255,255,255,0.05);
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 2.5rem;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #f472b6, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 0.9rem;
            color: #cbd5e1;
            margin-bottom: 25px;
        }

        .pin-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 25px;
        }

        .pin-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid rgba(244, 114, 182, 0.5);
            transition: all 0.2s ease;
        }

        .pin-dot.active {
            background: #f472b6;
            box-shadow: 0 0 12px #f472b6;
            border-color: #f472b6;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            max-width: 240px;
            margin: 0 auto;
        }

        .btn-key {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 1.2rem;
            font-weight: 600;
            padding: 14px 0;
            border-radius: 50%;
            width: 55px;
            height: 55px;
            margin: 0 auto;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn-key:active {
            background: rgba(244, 114, 182, 0.4);
            transform: scale(0.92);
        }

        .error-msg {
            color: #f87171;
            font-size: 0.85rem;
            margin-top: 15px;
            height: 20px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .error-msg.show {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="card">
        <h1>Love Galaxy 杜兒</h1>
        <p>Nhập mật mã tình yêu để khám phá</p>

        <div class="pin-container">
            <div class="pin-dot" id="dot-0"></div>
            <div class="pin-dot" id="dot-1"></div>
            <div class="pin-dot" id="dot-2"></div>
            <div class="pin-dot" id="dot-3"></div>
        </div>

        <div class="keypad">
            <button class="btn-key" onclick="pressKey('1')">1</button>
            <button class="btn-key" onclick="pressKey('2')">2</button>
            <button class="btn-key" onclick="pressKey('3')">3</button>
            <button class="btn-key" onclick="pressKey('4')">4</button>
            <button class="btn-key" onclick="pressKey('5')">5</button>
            <button class="btn-key" onclick="pressKey('6')">6</button>
            <button class="btn-key" onclick="pressKey('7')">7</button>
            <button class="btn-key" onclick="pressKey('8')">8</button>
            <button class="btn-key" onclick="pressKey('9')">9</button>
            <button class="btn-key" onclick="clearPIN()" style="font-size: 0.9rem;">C</button>
            <button class="btn-key" onclick="pressKey('0')">0</button>
            <button class="btn-key" onclick="deletePIN()" style="font-size: 0.9rem;">⌫</button>
        </div>

        <div class="error-msg" id="error">Sai mật mã rồi nha! thử lại đi nè ❤️</div>
    </div>

    <script>
        // MÃ PIN ĐÃ ĐƯỢC CẬP NHẬT THÀNH 2307
        const CORRECT_PIN = "2307"; 
        let currentInput = "";

        function updateDots() {
            for (let i = 0; i < 4; i++) {
                const dot = document.getElementById(`dot-${i}`);
                if (i < currentInput.length) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            }
        }

        function pressKey(num) {
            if (currentInput.length < 4) {
                currentInput += num;
                updateDots();
                
                if (currentInput.length === 4) {
                    setTimeout(checkPIN, 200);
                }
            }
        }

        function clearPIN() {
            currentInput = "";
            updateDots();
            hideError();
        }

        function deletePIN() {
            currentInput = currentInput.slice(0, -1);
            updateDots();
            hideError();
        }

        function checkPIN() {
            if (currentInput === CORRECT_PIN) {
                window.location.href = "thienhatinhyeu.html";
            } else {
                showError();
                currentInput = "";
                updateDots();
            }
        }

        function showError() {
            document.getElementById("error").classList.add("show");
        }

        function hideError() {
            document.getElementById("error").classList.remove("show");
        }
    </script>
</body>
</html>
