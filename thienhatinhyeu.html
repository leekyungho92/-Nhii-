<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Love Galaxy 杜兒</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Quicksand', sans-serif;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Title Overlay */
        .header-title {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            pointer-events: none;
        }

        .header-title h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 2.8rem;
            color: #fff;
            text-shadow: 0 0 10px rgba(244, 114, 182, 0.8), 0 0 20px rgba(192, 132, 252, 0.6);
        }

        /* Audio Control Button */
        .music-btn {
            position: absolute;
            bottom: 25px;
            right: 25px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }

        .music-btn:hover {
            transform: scale(1.1);
            background: rgba(244, 114, 182, 0.3);
        }

        /* Modal Popup for Photos (If clicked in 3D scene) */
        .photo-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .photo-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .photo-card {
            max-width: 85%;
            max-height: 80vh;
            border-radius: 16px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 30px rgba(244, 114, 182, 0.4);
            overflow: hidden;
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
    </style>
</head>
<body>

    <!-- Main 3D Canvas -->
    <div id="canvas-container"></div>

    <!-- Title UI -->
    <div class="header-title">
        <h1>Love Galaxy 杜兒</h1>
    </div>

    <!-- Music Toggle Button -->
    <div class="music-btn" id="musicToggle" onclick="toggleAudio()">
        🎵
    </div>

    <!-- Background Music -->
    <audio id="bgMusic" loop preload="auto">
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <!-- Photo Modal Preview -->
    <div class="photo-modal" id="photoModal" onclick="closeModal()">
        <div class="photo-card">
            <img id="modalImg" src="" alt="Love Galaxy Photo">
        </div>
    </div>

    <!-- Import Three.js & Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <!-- Main JS Logic -->
    <script src="thienhatinhyeu.js"></script>

    <script>
        // Audio Toggle Script
        const music = document.getElementById('bgMusic');
        let isPlaying = false;

        function toggleAudio() {
            if (isPlaying) {
                music.pause();
                document.getElementById('musicToggle').innerText = '🔇';
            } else {
                music.play().catch(e => console.log("Audio play blocked"));
                document.getElementById('musicToggle').innerText = '🎵';
            }
            isPlaying = !isPlaying;
        }

        function openModal(imgSrc) {
            document.getElementById('modalImg').src = imgSrc;
            document.getElementById('photoModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('photoModal').classList.remove('active');
        }
    </script>
</body>
</html>
